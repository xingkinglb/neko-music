# 静态自检流水线。
#
# ★ 为什么这三个脚本能上 CI，而别的不能：
#   .verify/verify.js / check-readme.js / check-icons.js 全部只用 Node 内置模块
#   （fs / path / zlib），**零第三方依赖**，三个加起来 0.9 秒跑完。
#   所以这里刻意**不跑 npm install** —— 省 30 秒，也让流水线不受依赖变更影响。
#
# ★ 为什么不把 test-round*.js 也放进来：
#   那一批是 Electron 离屏实测，要图形环境、30 个脚本、跑 12 分钟，
#   而且它们本来就要求本地真机验收（有些断言依赖真实渲染时序）。
#   放进来只会让 CI 又慢又飘，红了你也不知道是真坏了还是环境问题。
#
# ★ 换行符不会捣乱：.gitattributes 已经统一 eol=lf，
#   仓库里存的本来就是 LF，Linux runner 上读出来和本地一模一样。

name: 自检

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # 允许在网页 Actions 页手动点一下跑

permissions:
  contents: read # 只读就够，不需要写权限

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      # ★ 必须是 22，不能是 20。
      #   .verify/ 下的脚本有 32 处写成 `xxx.matchAll(re).map(...)` —— matchAll 返回的是
      #   **迭代器**而不是数组，能直接 .map 靠的是 Node 22 才有的 Iterator Helpers。
      #   在 Node 20 上会当场 TypeError（appjs.matchAll(...).map is not a function），
      #   整份自检连第一条断言都跑不到。src/ 里的产品代码没有这个写法，所以只影响自检。
      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 三步分开写，不串成一行：红了的时候一眼能看出挂在哪一类，
      # 而不是只看到一个笼统的 "exit code 1"。
      - name: 静态自检（64 大类）
        run: node .verify/verify.js

      - name: README 体检（7 项）
        run: node .verify/check-readme.js

      - name: 图标体检（38 项）
        run: node .verify/check-icons.js

      # 扫码登录的二维码：尺寸公式、三个定位图形、时序图形、静区、SVG 路径覆盖。
      # 这几项错了必然扫不出来（而"扫得出来"没法自动测，只能人拿手机扫）。
      - name: 二维码体检
        run: node .verify/check-qrcode.js

      # 扫完码之后"从响应里抠 cookie"那段纯字符串逻辑 —— 真机卡过一次，这里全覆盖。
      - name: 扫码登录解析
        run: node .verify/check-qr-login.js

      # 扫全仓 .js，不许有"matchAll 结果直接链式调用"的写法 ——
      # 那种写法只有 Node 22 认（Iterator Helpers），而 Electron 33 内置的是 Node 20，
      # 写在 src/ 里就是"用户一开软件就崩"。这条放最后：它能解释上面某一步为什么会崩。
      - name: Node 版本兼容（Iterator Helpers）
        run: node .verify/check-node-compat.js
